name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --workspace --locked --all-targets
      - name: Test
        run: |
          cargo test --workspace --locked
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Fmt
        run: |
          cargo fmt --all -- --check
      - name: Docs
        run: |
          cargo doc --workspace --no-deps
      - name: Audit (dependencies)
        if: ${{ matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Release build (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          cargo build --workspace --locked --release

  licenses:
    name: Distribution licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned license generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Fetch locked crate sources for offline license harvesting
        run: cargo fetch --locked
      - name: Install locked npm dependencies without downloading Oatty
        run: npm ci --ignore-scripts
      - name: Prepare and verify notices and covered source
        run: npm run licenses:prepare
      - name: Test fail-closed checks and actual distribution archives
        run: npm run test:licenses
      - name: Check generation is deterministic
        shell: bash
        run: |
          cp .license-manifest.json "$RUNNER_TEMP/license-manifest.json"
          npm run licenses:prepare
          cmp .license-manifest.json "$RUNNER_TEMP/license-manifest.json"
