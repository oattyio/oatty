name: Deploy Oatty Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'oatty.io/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'oatty.io/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oatty.io/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: oatty.io

      - name: Build site
        run: npm run build
        working-directory: oatty.io

      - name: Verify static site
        run: npm run check:static
        working-directory: oatty.io

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: oatty.io/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
